<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Storage Management Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-gray-100 min-h-screen font-sans">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">Storage Management Dashboard</h1>
        <a class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded" href="/signout">Sign Out</a>
    </header>

    <main class="p-6 space-y-6">

        <!-- Storage Containers -->
        <section class="bg-white p-4 rounded-lg shadow space-y-4">
            <h2 class="text-lg font-semibold text-center">Storage Modules</h2>
            <div class="flex gap-4 justify-center flex-wrap bg-white p-4 rounded-lg shadow">
                {% for container in containers %}
                <div class="flex flex-col border shadow-lg p-4 rounded-lg space-y-4 w-80"
                    data-items='{{ container.item | tojson }}' data-threshold='{{ container.threshold }}'>
                    <h3 class="font-bold mb-2 text-center">{{ container.name }}</h3>

                    <!-- Items Bar Graph -->
                    <div class="space-y-2">
                        <label class="block mb-1 font-medium">Items:</label>
                        <canvas class="w-full h-40 item-bar-graph"></canvas>
                    </div>
                    <form method="POST">

                        <!-- Container Controls -->
                        <div class="flex flex-wrap gap-4">
                            <div class="flex flex-col w-1/2">
                                <label class="font-medium mb-1">Storage Items</label>
                                <input type="text" value="{{ container.type }}" name="type" placeholder="Type of item"
                                    class="border p-2 rounded">
                            </div>
                            <div class="flex flex-col">
                                <label class="font-medium mb-1">Notification Threshold</label>
                                <input type="number" value="{{ container.threshold }}" name="threshold"
                                    placeholder="Minimum quantity" class="border p-2 rounded">
                            </div>
                        </div>

                        <!-- Buttons as forms -->
                        <div class="flex gap-2">
                            <!-- Confirm Changes -->
                            <input type="hidden" name="action" value="confirm">
                            <input type="hidden" name="container_id" value="{{ container.name }}">
                            <button type="submit" 
                                class="mt-2 w-4/5  bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded">
                                Confirm Changes
                            </button>

                            <!-- Reset Button -->
                            <input type="hidden" name="action" value="reset">
                            <input type="hidden" name="container_id" value="{{ container.name }}">
                            <button type="submit"
                                class="mt-2 w-1/5 bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded">
                                ↺
                            </button>

                        </div>
                    </form>
                </div>
                {% endfor %}
            </div>
        </section>

        <!-- Notifications -->
        <section class="bg-white p-4 rounded-lg shadow">
            <h2 class="text-lg font-semibold mb-2">Notifications</h2>
            <form method="POST">
                <input type="hidden" name="action" value="notifications">

                <div class="flex flex-wrap gap-4">
                    <div class="flex flex-col w-full md:w-1/2">
                        <label class="mb-1 font-medium">Phone Number</label>
                        <input type="tel" value="{{ notifications.phone }}" name="phone" placeholder="+1 555 1234"
                            class="border p-2 rounded">
                    </div>
                    <div class="flex flex-col w-full md:w-1/2">
                        <label class="mb-1 font-medium">Email</label>
                        <input type="email" value="{{ notifications.email }}" name="email"
                            placeholder="user@example.com" class="border p-2 rounded">
                    </div>
                </div>
                <button type="submit" class="mt-4 bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded">
                    Save Notifications
                </button>
            </form>
        </section>

    </main>

    <script>
        // Render bar graphs for each container
        document.querySelectorAll('.item-bar-graph').forEach(canvas => {
            const containerDiv = canvas.closest('div[data-items]');
            const items = JSON.parse(containerDiv.dataset.items);
            const threshold = parseFloat(containerDiv.dataset.threshold);

            const labels = items.map(item => item.name);
            const quantities = items.map(item => item.quantity);

            new Chart(canvas.getContext('2d'), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Quantity',
                            data: quantities,
                            backgroundColor: quantities.map(q => q >= threshold ? 'rgba(34,197,94,0.7)' : 'rgba(239,68,68,0.7)'),
                            borderColor: quantities.map(q => q >= threshold ? 'rgba(34,197,94,1)' : 'rgba(239,68,68,1)'),
                            borderWidth: 1
                        },
                        {
                            label: 'Threshold',
                            type: 'line',
                            data: Array(quantities.length).fill(threshold),
                            borderColor: 'red',
                            borderWidth: 2,
                            fill: false,
                            tension: 0
                        }
                    ]
                },
                options: {
                    scales: { y: { beginAtZero: true } },
                    plugins: { legend: { display: true } }
                }
            });
        });
    </script>

</body>

</html>
